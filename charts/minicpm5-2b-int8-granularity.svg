<text x="957.5" y="412" font-size="12" fill="#898781" text-anchor="middle">tokens / s</text>
<text x="44" y="500" font-size="13" fill="#52514e">Per-channel int8 lowers to a dequantize-then-matmul path on the Mac GPU; per-block-32 lands on the quantized-matmul path. On the phone decode is memory-bandwidth-bound either way.</text>
<text x="44" y="522" font-size="13" fill="#52514e">Numerics: both int8 bundles 16/16 token-exact vs the fp32 oracle (margin-aware gate); per-block-32 also matches fp32 on a 30-token free-run where per-channel flipped a 0.245-margin token.</text>
<text x="44" y="544" font-size="12" fill="#898781">github.com/john-rocky/coreai-model-zoo · models/minicpm5-2b · 2026-09-08</text>
